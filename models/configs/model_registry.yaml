models:
  claude-3-5-sonnet-20241022:
    provider: anthropic
    api_env_var: ANTHROPIC_API_KEY
    temperature: 0.0
    max_tokens: 2048
    context_window: 200000
    primary: true
    use_for:
      - extraction
      - verification
      - rewrite
      - adjudication

  claude-3-haiku-20240307:
    provider: anthropic
    api_env_var: ANTHROPIC_API_KEY
    temperature: 0.0
    max_tokens: 1024
    context_window: 200000
    primary: false
    use_for:
      - rewrite

  gpt-4o:
    provider: openai
    api_env_var: OPENAI_API_KEY
    temperature: 0.0
    max_tokens: 2048
    context_window: 128000
    primary: false
    use_for:
      - extraction
      - verification

embedding_models:
  default: "sentence-transformers/all-mpnet-base-v2"
  openai: "text-embedding-3-large"
